<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>

    <link rel="stylesheet" href="gallery.css">

</head>

<body>

<div class="background"></div>

<!-- ================================= -->
<!-- 発表モード：バナー＋テーマ選択 -->
<!-- ================================= -->
<div id="shareBanner" class="shareBanner" style="display:none;">
    <div class="shareBanner__inner">
        <div class="shareBanner__left">
            <p class="shareBanner__label">発表モード</p>
            <p class="shareBanner__desc">作品を選んで、各作品にテーマを設定してください</p>
        </div>
        <div class="shareBanner__themes">
            <span class="shareBanner__themeHint">⭐ 気に入った</span>
            <span class="shareBanner__themeHint">🎯 想像に近い</span>
            <span class="shareBanner__themeHint">😲 想像と違う</span>
            <span class="shareBanner__themeHint">🤖 AIが面白い</span>
            <span class="shareBanner__themeHint">💫 気持ち変化</span>
        </div>
        <button id="shareCancelBtn" class="shareBanner__cancel">× 発表モードを終了</button>
    </div>
</div>

<!-- 発表作品確定バナー -->
<div id="shareConfirmed" class="shareConfirmed" style="display:none;">
    <div class="shareConfirmed__header">
        <p class="shareConfirmed__label">選択中の発表作品</p>
        <button id="shareResetBtn" class="subButton">選択をリセット</button>
    </div>
    <!-- 選択作品カードリスト（JS で生成） -->
    <div id="shareConfirmedList" class="shareConfirmed__list"></div>
</div>

<main class="container">

    <header class="pageHeader" id="galleryHeader">

        <h1>My Gallery</h1>

        <p>

            あなたがAIと共創した作品一覧

        </p>

    </header>

    <!-- ===== Toolbar ===== -->

    <section class="toolbar glass">

        <input

            id="searchInput"

            type="text"

            placeholder="タイトルを検索">

        <select id="sortSelect">

            <option value="new">

                新しい順

            </option>

            <option value="old">

                古い順

            </option>

        </select>

        <button id="enterShareModeBtn" class="mainButton" style="white-space:nowrap;">
            発表する作品を選ぶ
        </button>

    </section>

    <!-- ===== Gallery ===== -->

    <section

        id="galleryGrid"

        class="galleryGrid">

    </section>

    <!-- ===== Empty ===== -->

    <section

        id="emptyState"

        class="glass emptyState">

        <h2>

            まだ作品がありません

        </h2>

        <p>

            ワークショップで作品を生成すると
            ここに保存されます。

        </p>

        <button

            class="mainButton"

            onclick="window.location.href='workshop.html'">

            作品をつくる

        </button>

    </section>

    <!-- ===== Footer ===== -->

    <div class="buttonArea">

        <button

            class="subButton"

            onclick="window.location.href='index.html'">

            ← Home

        </button>

    </div>
<!-- ================================= -->
<!-- Modal -->
<!-- ================================= -->

<div id="modal" class="modal">

    <div class="modalContent glass">

        <span id="closeModal" class="close">

            ×

        </span>

        <h2 id="modalTitle"></h2>

        <img
            id="modalImage"
            class="modalImage">

        <p id="modalReflection"></p>

        <div
            id="modalKeywords"
            class="keywordArea">

        </div>

        <p id="modalDate"></p>

        <button
            id="modalDownload"
            class="mainButton">

            ⬇ PNGダウンロード

        </button>

    </div>

</div>
</main>

<footer class="siteFooter">
    <p class="copyright">Copyright &copy; 2026 Art Reflection 研究会. All rights reserved.</p>
    <p class="copyright" style="margin-top:4px;display:flex;justify-content:center;gap:20px;">
        <a href="facilitator.html" style="color:inherit;opacity:.6;font-size:12px;">進行メモ（ファシリテーター用）</a>
        <a href="survey-admin.html" style="color:inherit;opacity:.6;font-size:12px;">アンケートデータ管理</a>
    </p>
</footer>

<script src="gallery.js"></script>

</body>

</html>
