<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>

    <link rel="stylesheet" href="gallery.css">

</head>

<body>

<div class="background"></div>

<!-- ================================= -->
<!-- 発表モード：バナー＋テーマ選択 -->
<!-- ================================= -->
<div id="shareBanner" class="shareBanner" style="display:none;">
    <div class="shareBanner__inner">
        <div class="shareBanner__left">
            <p class="shareBanner__label">発表モード</p>
            <p class="shareBanner__desc">発表したい作品を1点選んでください</p>
        </div>
        <div class="shareBanner__themes" id="shareThemes">
            <button class="shareThemeBtn shareThemeBtn--active" data-theme="favorite">⭐ 一番気に入った</button>
            <button class="shareThemeBtn" data-theme="closest">🎯 想像に一番近かった</button>
            <button class="shareThemeBtn" data-theme="surprising">😲 一番想像と違った</button>
            <button class="shareThemeBtn" data-theme="aiInterpret">🤖 AIの解釈が面白かった</button>
            <button class="shareThemeBtn" data-theme="emotion">💫 気持ちが変化した</button>
        </div>
        <button id="shareCancelBtn" class="shareBanner__cancel">× 発表モードを終了</button>
    </div>
</div>

<!-- 発表作品確定バナー -->
<div id="shareConfirmed" class="shareConfirmed" style="display:none;">
    <div class="shareConfirmed__inner">
        <img id="shareConfirmedImg" class="shareConfirmed__img" alt="">
        <div class="shareConfirmed__body">
            <p class="shareConfirmed__label">発表作品</p>
            <p id="shareConfirmedTitle" class="shareConfirmed__title"></p>
            <p id="shareConfirmedTheme" class="shareConfirmed__theme"></p>
            <div class="shareConfirmed__reasonWrap">
                <label for="shareReason">選んだ理由・想像との違い（任意）</label>
                <textarea id="shareReason" rows="2" placeholder="例：AIが意外に暗い色を選んでいて、自分の気持ちと一致していた"></textarea>
            </div>
            <div class="shareConfirmed__actions">
                <button id="shareReasonSaveBtn" class="mainButton">メモを保存する</button>
                <button id="shareResetBtn" class="subButton">選び直す</button>
            </div>
        </div>
    </div>
</div>

<main class="container">

    <header class="pageHeader" id="galleryHeader">

        <h1>My Gallery</h1>

        <p>

            あなたがAIと共創した作品一覧

        </p>

    </header>

    <!-- ===== Toolbar ===== -->

    <section class="toolbar glass">

        <input

            id="searchInput"

            type="text"

            placeholder="タイトルを検索">

        <select id="sortSelect">

            <option value="new">

                新しい順

            </option>

            <option value="old">

                古い順

            </option>

        </select>

        <button id="enterShareModeBtn" class="mainButton" style="white-space:nowrap;">
            発表する作品を選ぶ
        </button>

    </section>

    <!-- ===== Gallery ===== -->

    <section

        id="galleryGrid"

        class="galleryGrid">

    </section>

    <!-- ===== Empty ===== -->

    <section

        id="emptyState"

        class="glass emptyState">

        <h2>

            まだ作品がありません

        </h2>

        <p>

            ワークショップで作品を生成すると
            ここに保存されます。

        </p>

        <button

            class="mainButton"

            onclick="window.location.href='workshop.html'">

            作品をつくる

        </button>

    </section>

    <!-- ===== Footer ===== -->

    <div class="buttonArea">

        <button

            class="subButton"

            onclick="window.location.href='index.html'">

            ← Home

        </button>

    </div>
<!-- ================================= -->
<!-- Modal -->
<!-- ================================= -->

<div id="modal" class="modal">

    <div class="modalContent glass">

        <span id="closeModal" class="close">

            ×

        </span>

        <h2 id="modalTitle"></h2>

        <img
            id="modalImage"
            class="modalImage">

        <p id="modalReflection"></p>

        <div
            id="modalKeywords"
            class="keywordArea">

        </div>

        <p id="modalDate"></p>

        <button
            id="modalDownload"
            class="mainButton">

            ⬇ PNGダウンロード

        </button>

    </div>

</div>
</main>

<footer class="siteFooter">
    <p class="copyright">Copyright &copy; 2026 Art Reflection 研究会. All rights reserved.</p>
    <p class="copyright" style="margin-top:4px;">
        <a href="survey-admin.html" style="color:inherit;opacity:.6;font-size:12px;">アンケートデータ管理</a>
    </p>
</footer>

<script src="gallery.js"></script>

</body>

</html>
